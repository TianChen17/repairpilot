services:
  postgres:
    image: postgres:16-alpine
    platform: linux/arm64
    restart: unless-stopped
    environment:
      POSTGRES_DB: repairpilot
      POSTGRES_USER: repairpilot
      POSTGRES_PASSWORD: repairpilot-local-only
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U repairpilot -d repairpilot"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - repairpilot-postgres:/var/lib/postgresql/data

volumes:
  repairpilot-postgres:
