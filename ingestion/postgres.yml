source:
  type: postgres
  config:
    host_port: 127.0.0.1:5433
    database: repairpilot
    username: repairpilot
    password: ${POSTGRES_PASSWORD}
    platform_instance: repairpilot-demo
    env: PROD
    schema_pattern:
      allow:
        - ^analytics(_.*)?$
      deny:
        - ^pg_.*
        - ^information_schema$
    include_tables: true
    include_views: true
    include_view_lineage: true
    include_view_column_lineage: true
    include_query_lineage: false
    profiling:
      enabled: false

sink:
  type: datahub-rest
  config:
    server: http://127.0.0.1:8080
