name: quality-gates

on:
  push:
    branches: [main, "repair/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: repairpilot
          POSTGRES_USER: repairpilot
          POSTGRES_PASSWORD: repairpilot-local-only
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U repairpilot -d repairpilot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -e '.[dev]'
      - run: python scripts/generate_seed.py
      - run: ruff check backend scripts
      - run: pytest --cov=app --cov-report=term-missing --cov-fail-under=75 backend/tests
      - run: dbt seed --project-dir warehouse --profiles-dir warehouse
        env:
          POSTGRES_HOST: 127.0.0.1
          POSTGRES_PORT: 5433
          POSTGRES_DB: repairpilot
          POSTGRES_USER: repairpilot
          POSTGRES_PASSWORD: repairpilot-local-only
      - run: dbt build --project-dir warehouse --profiles-dir warehouse
        env:
          POSTGRES_HOST: 127.0.0.1
          POSTGRES_PORT: 5433
          POSTGRES_DB: repairpilot
          POSTGRES_USER: repairpilot
          POSTGRES_PASSWORD: repairpilot-local-only
      - run: npm ci --prefix frontend
      - run: npm --prefix frontend run build

