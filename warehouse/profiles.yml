repairpilot:
  target: demo
  outputs:
    demo:
      type: postgres
      host: "{{ env_var('POSTGRES_HOST', '127.0.0.1') }}"
      port: "{{ env_var('POSTGRES_PORT', '5433') | int }}"
      user: "{{ env_var('POSTGRES_USER', 'repairpilot') }}"
      password: "{{ env_var('POSTGRES_PASSWORD', 'repairpilot-local-only') }}"
      dbname: "{{ env_var('POSTGRES_DB', 'repairpilot') }}"
      schema: "{{ env_var('DBT_TARGET_SCHEMA', 'analytics') }}"
      threads: 4
      connect_timeout: 10

